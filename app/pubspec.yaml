name: nexamart_customer

description: VJoyKart customer marketplace app.
publish_to: "none"
version: 2.1.2+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  razorpay_flutter: ^1.4.5
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/categories/
    - assets/images/products/
    - assets/images/vjoykart_icon.png
