server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nexamart-customer-backend
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Production DB already has newer migrations recorded; apply older pending ones.
    out-of-order: true
    ignore-migration-patterns:
      - "*:missing"
      - "*:future"
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  currency: ${RAZORPAY_CURRENCY:INR}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

security:
  jwt:
    secret: ${NEXAMART_JWT_SECRET:${JWT_SECRET:}}
    access-expiration-seconds: ${NEXAMART_ACCESS_EXPIRATION_SECONDS:3600}
  bootstrap-admin:
    email: ${NEXAMART_ADMIN_EMAIL:}
    password: ${NEXAMART_ADMIN_PASSWORD:}
    name: ${NEXAMART_ADMIN_NAME:VJoyKart Admin}


nexamart:
  jwt-secret: ${NEXAMART_JWT_SECRET:${JWT_SECRET:}}
  access-token-minutes: ${NEXAMART_ACCESS_TOKEN_MINUTES:60}
  refresh-token-days: ${NEXAMART_REFRESH_TOKEN_DAYS:30}
  admin-username: ${NEXAMART_ADMIN_USERNAME:admin}
  admin-password: ${NEXAMART_ADMIN_PASSWORD:admin@223}
  admin-email: ${NEXAMART_ADMIN_EMAIL:admin@nexamart.local}
  admin-name: ${NEXAMART_ADMIN_NAME:VJoyKart Admin}
  # Customer mobile OTP (2Factor SMS)
  otp-api-key: ${TWOFACTOR_API_KEY:}
  otp-template-name: ${TWOFACTOR_OTP_TEMPLATE:}
  otp-ttl-seconds: ${OTP_TTL_SECONDS:300}
  otp-dev-mode: ${OTP_DEV_MODE:false}
  
twofactor:
  api-key: ${TWOFACTOR_API_KEY:}
  base-url: ${TWOFACTOR_BASE_URL:https://2factor.in}
  voice-base-url: ${TWOFACTOR_VOICE_BASE_URL:${TWOFACTOR_BASE_URL:https://2factor.in}}
  timeout-seconds: ${TWOFACTOR_TIMEOUT_SECONDS:10}
  sender-id: ${TWOFACTOR_SENDER_ID:}
  # Retained for compatibility and startup diagnostics.
  # For current OTP SMS endpoint, sender/template are account-side mapping.
  otp-template: ${TWOFACTOR_OTP_TEMPLATE:}

# Fixed VJoyKart Store location (resolved once from https://maps.app.goo.gl/2j5t44Xc4DJJSvjR9)
# and automatic delivery-partner dispatch rules. Never geocoded at runtime.
vjoykart:
  store:
    name: ${VJOYKART_STORE_NAME:VJoyKart Store}
    latitude: ${VJOYKART_STORE_LATITUDE:17.3899091}
    longitude: ${VJOYKART_STORE_LONGITUDE:78.383089}
    maps-url: ${VJOYKART_STORE_MAPS_URL:https://maps.app.goo.gl/2j5t44Xc4DJJSvjR9}
    address: ${VJOYKART_STORE_ADDRESS:Bharat Nagar, Ibrahim Bagh, Hyderabad, Telangana 500089}
  dispatch:
    initial-radius-km: ${VJOYKART_DISPATCH_INITIAL_RADIUS_KM:5}
    fallback-radius-km: ${VJOYKART_DISPATCH_FALLBACK_RADIUS_KM:8}
    location-max-age-seconds: ${VJOYKART_DISPATCH_LOCATION_MAX_AGE_SECONDS:300}
    pending-order-max-age-minutes: ${VJOYKART_DISPATCH_PENDING_ORDER_MAX_AGE_MINUTES:180}
    retry-enabled: ${VJOYKART_DISPATCH_RETRY_ENABLED:true}
    retry-interval-ms: ${VJOYKART_DISPATCH_RETRY_INTERVAL_MS:30000}