server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nexamart-customer-backend
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER}
    password: ${MYSQL_ROOT_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    ignore-migration-patterns:
      - "*:missing"
      - "*:future"
  jackson:
    serialization:
      write-dates-as-timestamps: false

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

security:
  jwt:
    secret: ${NEXAMART_JWT_SECRET:}
    access-expiration-seconds: ${NEXAMART_ACCESS_EXPIRATION_SECONDS:3600}
  bootstrap-admin:
    email: ${NEXAMART_ADMIN_EMAIL:}
    password: ${NEXAMART_ADMIN_PASSWORD:}
    name: ${NEXAMART_ADMIN_NAME:VJoyKart Admin}


nexamart:
  jwt-secret: ${NEXAMART_JWT_SECRET:}
  access-token-minutes: ${NEXAMART_ACCESS_TOKEN_MINUTES:60}
  refresh-token-days: ${NEXAMART_REFRESH_TOKEN_DAYS:30}
  admin-username: ${NEXAMART_ADMIN_USERNAME:admin}
  admin-password: ${NEXAMART_ADMIN_PASSWORD:admin@223}
  admin-email: ${NEXAMART_ADMIN_EMAIL:admin@nexamart.local}
  admin-name: ${NEXAMART_ADMIN_NAME:VJoyKart Admin}
  otp-api-key: ${TWO_FACTOR_API_KEY:}
  otp-template-name: ${TWO_FACTOR_TEMPLATE_NAME:}
  otp-ttl-seconds: ${OTP_TTL_SECONDS:300}
  otp-dev-mode: ${OTP_DEV_MODE:false}
